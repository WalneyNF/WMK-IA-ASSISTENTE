name: Publicar fontes WMK IA v0.6.0

on:
  push:
    branches: [main]
    paths: ['publicacao/wmk-ia-assistente-v0.6.0-fontes.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-wmk-v060
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extrair fontes permitidos e validar identidade
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, json, stat
          archive=pathlib.Path('publicacao/wmk-ia-assistente-v0.6.0-fontes.zip')
          if not archive.is_file(): raise SystemExit('Envie o ZIP em publicacao/')
          required={'package.json','extension.js','stream.js','proposals.js','agent-tools.js','skills-catalog.js','default-agents.js','tool-registry.js'}
          names={}
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist()
              if len(infos)>500 or sum(i.file_size for i in infos)>30*1024*1024:
                  raise SystemExit('ZIP grande demais')
              for info in infos:
                  if info.is_dir(): continue
                  raw=info.filename.replace(chr(92),'/')
                  parts=pathlib.PurePosixPath(raw)
                  if parts.is_absolute() or '..' in parts.parts or stat.S_ISLNK(info.external_attr>>16):
                      raise SystemExit('Caminho inseguro: '+raw)
                  if parts.parts[0]=='wmk-ia-assistente':
                      name='/'.join(parts.parts[1:])
                  else:
                      name='/'.join(parts.parts)
                  if not name or name in names:
                      raise SystemExit('Nome vazio/duplicado')
                  names[name]=info
              if not required.issubset(names):
                  raise SystemExit('Faltam fontes: '+str(required-set(names)))
              pkg=json.loads(z.read(names['package.json']))
              if (pkg.get('publisher'),pkg.get('name'),pkg.get('version'))!=('wmk-estudos','wmk-ia-assistente','0.6.0'):
                  raise SystemExit('Publisher/name/version nao conferem com VSIX enviado')
              extras={'LICENSE','CHANGELOG.md','CONTRIBUTING.md','.gitignore','.vscodeignore','wmk-build-helper.js','GUIA-GITHUB.md','ANALISE-TECNICA-v060.md','PUBLICAR-FONTES-DO-ZIP.ps1','WMK-PUBLICAR-FONTES.bat','COMO-ATUALIZAR-v060.txt','WMK-ATUALIZAR-v060.bat'}
              for name,info in names.items():
                  if name not in required|extras and not name.startswith(('media/','tests/','manuais/')):
                      continue
                  if info.file_size>2*1024*1024: raise SystemExit('Arquivo individual grande: '+name)
                  target=pathlib.Path(name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info))
          print('Fontes extraidos e identidade validada.')
          PY
      - name: Verificar JavaScript
        run: npm run check
      - name: Rodar testes
        run: npm test
      - name: Gerar VSIX
        run: |
          npx --yes @vscode/vsce package --no-dependencies
          test -s wmk-ia-assistente-0.6.0.vsix
      - name: Publicar VSIX como artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMK-IA-Assistente-v0.6.0-VSIX
          path: wmk-ia-assistente-0.6.0.vsix
          retention-days: 30
      - name: Publicar codigo validado
        run: |
          git config user.name 'WMK GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- .
          git rm -f -- publicacao/wmk-ia-assistente-v0.6.0-fontes.zip
          git diff --cached --quiet || git commit -m 'release: publicar fontes WMK IA v0.6.0'
          git push origin HEAD:main
      - name: Anexar VSIX ao GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 wmk-ia-assistente-0.6.0.vsix --clobber
          else
            gh release create v0.6.0 wmk-ia-assistente-0.6.0.vsix --target "$(git rev-parse HEAD)" --title 'WMK IA Assistente v0.6.0' --prerelease --notes 'Fontes e instalador VSIX; extensao experimental. MCP externo ainda somente catalogo.'
          fi
